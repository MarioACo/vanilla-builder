name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  node16:
    # node --test no existe en Node 16: se ejecutan los archivos directamente.
    name: Node 16
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: node --version && npm run test:node16

  browser:
    # Compila los sitios de ejemplo (también con Node 16) y compara original y salida en Chrome.
    name: Navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: echo "NODE16=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:browser
        env:
          BUILDER_CHROMIUM: /usr/bin/google-chrome
      - run: npm run test:browser
        env:
          BUILDER_CHROMIUM: /usr/bin/google-chrome
          BUILDER_NODE: ${{ env.NODE16 }}
          BUILDER_NODE_LABEL: Node 16

  action:
    # La GitHub Action del repo, con el código actual (no la versión de npm).
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: ok
        uses: ./
        with:
          directory: test/fixtures/classic
          version: ${{ github.workspace }}
          node-version: none
          args: --hash --compress
      - name: Comprobar salidas
        run: |
          test -n "${{ steps.ok.outputs.total-size }}"
          test -f test/fixtures/classic/dist/index.html
      - id: over
        continue-on-error: true
        uses: ./
        with:
          directory: test/fixtures/modules
          version: ${{ github.workspace }}
          node-version: none
          cache: 'false'
          args: --budget=total=10B
      - name: Un presupuesto superado debe fallar
        if: steps.over.outcome != 'failure'
        run: exit 1
